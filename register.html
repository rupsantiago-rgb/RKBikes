<header>

<div class="login-box">

<h1 id="registerTitle">
Create an Account
</h1>


<form
id="registerForm"
action="register.php"
method="POST">


<input
type="text"
id="username"
name="username"
placeholder="Username"
required
>


<input
type="password"
id="password"
name="password"
placeholder="Password"
required
>


<input
type="password"
id="confirm_password"
name="confirm_password"
placeholder="Confirm Password"
required
>


<button
type="submit"
id="registerButton">
Register
</button>


<div id="feedback"></div>


</form>


<p>

<span id="alreadyAccount">
Already have an account?
</span>

<a href="login.html" id="loginHere">
Log in here
</a>.

</p>
